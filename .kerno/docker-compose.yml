version: '3.8'

services:
  postgres:
    image: "postgres:14-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=realworld_user"
      - "POSTGRES_PASSWORD=realworld_password"
      - "POSTGRES_DB=realworld_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U realworld_user -d realworld_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/realworld_db?user=realworld_user&password=realworld_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Stage 1: Build stage
        FROM node:14-alpine AS builder

        # Set working directory
        WORKDIR /app

        # Install build dependencies for native modules (argon2)
        RUN apk add --no-cache python3 make g++

        # Copy package files
        COPY package*.json ./

        # Install all dependencies (including devDependencies for build)
        RUN npm ci

        # Install pg driver for PostgreSQL
        RUN npm install pg --save

        # Copy source code
        COPY . .

        # Create config file with SECRET if it doesn't exist
        RUN mkdir -p src && \
            echo "export const SECRET = process.env.SECRET || 'secret';" > src/config.ts

        # Build the application
        RUN npm run prestart:prod

        # Stage 2: Production stage
        FROM node:14-alpine

        # Set working directory
        WORKDIR /app

        # Install build dependencies for native modules (argon2)
        RUN apk add --no-cache python3 make g++

        # Copy package files
        COPY package*.json ./

        # Install only production dependencies
        RUN npm ci --only=production && \
            npm cache clean --force

        # Install pg driver for PostgreSQL
        RUN npm install pg --save

        # Remove build dependencies to reduce image size
        RUN apk del python3 make g++

        # Copy built application from builder stage
        COPY --from=builder /app/dist ./dist

        # Copy any other necessary files (like index.js if needed)
        COPY index.js ./

        # Expose the application port (default NestJS port)
        EXPOSE 3000

        # Set NODE_ENV to production
        ENV NODE_ENV=production

        # Set default SECRET (should be overridden in production)
        ENV SECRET=changeme

        # Run the compiled application directly
        CMD ["node", "dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
