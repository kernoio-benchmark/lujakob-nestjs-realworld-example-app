services:
  postgres:
    image: "postgres:14-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=test_user"
      - "POSTGRES_PASSWORD=test_password"
      - "POSTGRES_DB=test_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U test_user -d test_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/test_db?user=test_user&password=test_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Multi-stage Dockerfile for NestJS Realworld Example App
        
        # Stage 1: Build stage
        FROM node:14-alpine AS builder
        
        WORKDIR /app
        
        # Install build dependencies for native modules (argon2)
        RUN apk add --no-cache python3 make g++
        
        # Copy package files
        COPY package*.json ./
        
        # Install all dependencies (including devDependencies for build)
        RUN npm ci
        
        # Copy source code
        COPY . .
        
        # Create the missing config file with SECRET constant
        RUN mkdir -p src && \
            echo "export const SECRET = process.env.SECRET || 'secret';" > src/config.ts
        
        # Build the application (compile TypeScript to dist/)
        RUN npm run prestart:prod
        
        # Stage 2: Production stage
        FROM node:14-alpine
        
        WORKDIR /app
        
        # Install build dependencies for native modules (argon2)
        RUN apk add --no-cache python3 make g++
        
        # Copy package files
        COPY package*.json ./
        
        # Install only production dependencies
        RUN npm ci --only=production && \
            npm cache clean --force
        
        # Remove build dependencies to reduce image size
        RUN apk del python3 make g++
        
        # Copy compiled application from builder stage
        COPY --from=builder /app/dist ./dist
        
        # Copy index.js (main entry point)
        COPY index.js ./
        
        # Copy src directory for entity files
        COPY --from=builder /app/src ./src
        
        # Expose application port
        EXPOSE 3000
        
        # Set NODE_ENV to production
        ENV NODE_ENV=production
        
        # Run the application in production mode
        CMD ["node", "dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
